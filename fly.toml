# Canonical deployment configuration for the access gateway.
# Deployment authority must map only to infrastructure that exists and is controlled.

app = "jpv-os"
primary_region = "iad"

[build]
  image = "ghcr.io/jaypventures-llc/jpv-os@sha256:a6d96dd1926375ace04a5cc2966b0a0e6c408415c22aa8c431185bcc4f039e33"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  JPV_DEPLOYMENT_AUTHORITY = "production"
  JPV_FOUNDER_ID = "founder"
  JPV_FOUNDER_ACCESS_KEY_SHA256 = "7096CFC6B9595863203F31A33F574B572B7EDD87B0ACBF0A4205A5EA5984817B"
  JPV_OUTBOUND_DATA_DIR = "/var/data/jpv"

[[mounts]]
  source = "jpv_outbound_data"
  destination = "/var/data/jpv"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
