# Authoritative production deployment for JPV-OS Access Gateway
services:
  - type: web
    name: jpv-os
    runtime: docker
    dockerfilePath: ./src/JPVOS/Dockerfile
    dockerContext: ./src/JPVOS
    region: oregon
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    previews:
      generation: manual
    disk:
      name: jpv-os-data
      mountPath: /var/data/jpv
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: JPV_DEPLOYMENT_AUTHORITY
        value: render-production
      - key: JPV_OUTBOUND_DATA_DIR
        value: /var/data/jpv
